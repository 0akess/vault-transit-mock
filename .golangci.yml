version: "2"

run:
  timeout: "5m"
  go: "1.26"

formatters:
  settings:
    gci:
      no-inline-comments: false
      no-prefix-comments: false
      custom-order: true
      no-lex-order: false
      sections:
        - standard
        - default
    golines:
      max-len: 120
      tab-len: 4
      shorten-comments: true
      reformat-tags: false
      chain-split-dots: true
  enable:
    - goimports
    - golines
    - gci

linters:
  default: none

  exclusions:
    warn-unused: true
    generated: strict
    rules:
      - linters:
          - err113
        text: do not define dynamic errors
      - path: "_test.go$"
        linters:
          - revive
        text: "^file-length-limit:"
      - path: "_test.go$"
        linters:
          - goconst
          - errcheck
          - funlen
          - cyclop
          - forcetypeassert
          - contextcheck
          - wrapcheck
          - noctx
      - path: "_test.go$"
        linters:
          - revive
        text: "^(unchecked-type-assertion|bool-literal-in-expr|unnecessary-format|use-slices-sort):"

  settings:
    copyloopvar:
      check-alias: true
    cyclop:
      max-complexity: 15
      package-average: 0
    decorder:
      dec-order:
        - const
        - var
        - type
        - func
      ignore-underscore-vars: false
      disable-dec-order-check: false
      disable-init-func-first-check: false
      disable-dec-num-check: true
      disable-type-dec-num-check: true
      disable-const-dec-num-check: true
      disable-var-dec-num-check: true
    depguard:
      rules:
        std:
          list-mode: original
          allow:
            - "$gostd"
            - vault-transit-mock
    errcheck:
      check-type-assertions: true
      check-blank: true
      disable-default-exclusions: false
      verbose: false
    forbidigo:
      exclude-godoc-examples: true
      analyze-types: true
      forbid:
        - pattern: ^print(ln)?$
          msg: Do not use print.
        - pattern: ^fmt\.Print.*$
          msg: Do not use print.
    funlen:
      lines: 100
      statements: 40
      ignore-comments: true
    gocognit:
      min-complexity: 40
    goconst:
      match-constant: true
      min-len: 3
      min-occurrences: 3
      ignore-calls: true
      numbers: false
      find-duplicates: true
      eval-const-expressions: false
    gocritic:
      disable-all: true
      enable-all: false
      enabled-checks:
        - appendAssign
        - appendCombine
        - argOrder
        - assignOp
        - badCall
        - badCond
        - badLock
        - badRegexp
        - badSorting
        - badSyncOnceFunc
        - boolExprSimplify
        - builtinShadow
        - builtinShadowDecl
        - caseOrder
        - commentedOutCode
        - commentedOutImport
        - defaultCaseOrder
        - deferInLoop
        - deferUnlambda
        - deprecatedComment
        - dupArg
        - dupBranchBody
        - dupCase
        - dupImport
        - dupOption
        - dupSubExpr
        - dynamicFmtString
        - elseif
        - emptyDecl
        - emptyFallthrough
        - equalFold
        - evalOrder
        - exitAfterDefer
        - exposedSyncMutex
        - externalErrorReassign
        - filepathJoin
        - flagDeref
        - flagName
        - httpNoBody
        - ifElseChain
        - importShadow
        - indexAlloc
        - initClause
        - mapKey
        - methodExprCall
        - nestingReduce
        - newDeref
        - nilValReturn
        - octalLiteral
        - offBy1
        - preferDecodeRune
        - preferFilepathJoin
        - preferFprint
        - preferStringWriter
        - preferWriteByte
        - ptrToRefParam
        - rangeAppendAll
        - redundantSprint
        - regexpMust
        - regexpPattern
        - regexpSimplify
        - returnAfterHttpError
        - singleCaseSwitch
        - sliceClear
        - sloppyLen
        - sloppyReassign
        - sloppyTypeAssert
        - sortSlice
        - sqlQuery
        - stringConcatSimplify
        - stringXbytes
        - stringsCompare
        - switchTrue
        - syncMapLoadAndDelete
        - timeExprSimplify
        - todoCommentWithoutDetail
        - tooManyResultsChecker
        - truncateCmp
        - typeAssertChain
        - typeSwitchVar
        - typeUnparen
        - uncheckedInlineErr
        - underef
        - unlabelStmt
        - unlambda
        - unnecessaryBlock
        - unnecessaryDefer
        - unslice
        - valSwap
        - weakCond
        - whyNoLint
        - wrapperFunc
        - yodaStyleExpr
        - zeroByteRepeat
      settings:
        commentedOutCode:
          minLength: 3
        ifElseChain:
          minThreshold: 3
        nestingReduce:
          bodyWidth: 5
        tooManyResultsChecker:
          maxResults: 4
    godox:
      keywords:
        - FIXME
        - BUG
    gosec:
      excludes:
        - G115
    govet:
      disable-all: true
      enable:
        - appends
        - asmdecl
        - assign
        - atomic
        - atomicalign
        - bools
        - buildtag
        - cgocall
        - composites
        - copylocks
        - deepequalerrors
        - defers
        - directive
        - errorsas
        - findcall
        - framepointer
        - hostport
        - httpmux
        - httpresponse
        - ifaceassert
        - loopclosure
        - lostcancel
        - nilfunc
        - nilness
        - printf
        - reflectvaluecompare
        - shadow
        - shift
        - sigchanyzer
        - slog
        - sortslice
        - stdmethods
        - stdversion
        - stringintconv
        - structtag
        - testinggoroutine
        - tests
        - timeformat
        - unmarshal
        - unreachable
        - unsafeptr
        - unusedresult
        - unusedwrite
        - waitgroup
    lll:
      tab-width: 4
      line-length: 120
    mnd:
      checks:
        - argument
        - case
        - condition
        - operation
        - return
        - assign
      ignored-functions:
        - '^strconv\.\w+$'
    revive:
      enable-all-rules: false
      rules:
        - name: argument-limit
          arguments:
            - 8
        - name: atomic
        - name: bare-return
        - name: blank-imports
        - name: bool-literal-in-expr
        - name: comment-spacings
          arguments:
            - build
            - nolint
        - name: confusing-results
        - name: constant-logical-expr
        - name: context-as-argument
          arguments:
            - allow-types-before: "*testing.T"
        - name: context-keys-type
        - name: datarace
        - name: deep-exit
        - name: defer
        - name: dot-imports
        - name: duplicated-imports
        - name: early-return
        - name: empty-block
        - name: empty-lines
        - name: error-naming
        - name: error-return
          severity: warning
        - name: error-strings
        - name: errorf
        - name: file-length-limit
          arguments:
            - max: 200
              skip-comments: false
              skip-blank-lines: false
        - name: filename-format
          arguments:
            - "^[a-z][_a-z0-9]*\\.go$"
        - name: forbidden-call-in-wg-go
        - name: get-return
        - name: identical-branches
        - name: identical-ifelseif-branches
        - name: identical-ifelseif-conditions
        - name: identical-switch-branches
        - name: identical-switch-conditions
        - name: if-return
        - name: import-alias-naming
          arguments:
            - "^[a-z][a-z0-9]{0,}$"
        - name: import-shadowing
        - name: increment-decrement
        - name: indent-error-flow
        - name: inefficient-map-lookup
        - name: modifies-parameter
        - name: modifies-value-receiver
        - name: nested-structs
        - name: optimize-operands-order
        - name: range
        - name: redefines-builtin-id
        - name: redundant-build-tag
        - name: redundant-import-alias
        - name: redundant-test-main-exit
        - name: string-format
          arguments:
            - - "fmt.Errorf[0]"
              - "/^((.+: )+%w)|(%w(: .+)+)$/"
              - 'need use format "some text: %w"'
        - name: string-of-int
        - name: superfluous-else
        - name: time-date
        - name: time-equal
        - name: time-naming
        - name: unchecked-type-assertion
        - name: unconditional-recursion
        - name: unexported-naming
        - name: unexported-return
        - name: unhandled-error
        - name: unnecessary-if
        - name: unnecessary-format
        - name: unnecessary-stmt
        - name: unreachable-code
        - name: use-any
        - name: use-errors-new
        - name: use-slices-sort
        - name: use-waitgroup-go
        - name: useless-break
        - name: useless-fallthrough
        - name: var-declaration
        - name: waitgroup-by-value
    sloglint:
      kv-only: false
      no-mixed-args: true
      attr-only: true
      no-global: all
      context: scope
      static-msg: true
      msg-style: lowercased
      no-raw-keys: false
      key-naming-case: snake
      args-on-sep-lines: false
      forbidden-keys:
        - err
    testifylint:
      enable-all: true
    usetesting:
      os-create-temp: true
      os-mkdir-temp: true
      os-setenv: true
      os-temp-dir: true
      os-chdir: true
      context-background: true
      context-todo: true
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funcorder
    - funlen
    - gocheckcompilerdirectives
    - gocognit
    - goconst
    - gocritic
    - godox
    - gosec
    - govet
    - iface
    - ineffassign
    - intrange
    - lll
    - mnd
    - modernize
    - musttag
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - testifylint
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
